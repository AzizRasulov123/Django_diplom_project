<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #198754, #28a745);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-card {
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            padding: 30px;
        }

        .register-card h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: 600;
            color: #198754;
        }

        .btn-register {
            background-color: #198754;
            color: white;
            font-weight: 500;
            width: 100%;
        }

        .btn-register:hover {
            background-color: #157347;
            color: white;
        }

        .form-control:focus {
            border-color: #198754;
            box-shadow: 0 0 0 0.2rem rgba(25, 135, 84, 0.25);
        }

        .login-link {
            text-align: center;
            margin-top: 15px;
        }

        .login-link a {
            color: #198754;
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="register-card">
        <h2>Регистрация</h2>
        <form method="post">
    {% csrf_token %}

    <!-- Username -->
    <div class="mb-3">
    <label for="username" class="form-label">Имя пользователя</label>
    <input type="text" class="form-control" id="username" name="username" placeholder="Введите имя" required>
    {% for error in form.username.errors %}
        <div class="text-danger">{{ error }}</div>
    {% endfor %}
</div>

<!-- Email -->
<div class="mb-3">
    <label for="email" class="form-label">Электронная почта</label>
    <input type="email" class="form-control" id="email" name="email" placeholder="example@mail.com" required>
    {% for error in form.email.errors %}
        <div class="text-danger">{{ error }}</div>
    {% endfor %}
</div>

<!-- Password -->
<div class="mb-3">
    <label for="password" class="form-label">Пароль</label>
    <input type="password" class="form-control" id="password" name="password1" placeholder="Введите пароль" required>
    {% for error in form.password1.errors %}
        <div class="text-danger">{{ error }}</div>
    {% endfor %}
</div>

<!-- Confirm Password -->
<div class="mb-4">
    <label for="confirm_password" class="form-label">Повторите пароль</label>
    <input type="password" class="form-control" id="confirm_password" name="password2" placeholder="Повторите пароль" required>
    {% for error in form.password2.errors %}
        <div class="text-danger">{{ error }}</div>
    {% endfor %}
</div>

    <button type="submit" class="btn btn-register">Зарегистрироваться</button>
</form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
